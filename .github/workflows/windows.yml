name: Windows builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push builds cover branches in this repository. Fork PRs need their own run.
# Keep PR concurrency separate so a skipped same-repository PR cannot cancel a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Verify Qt test imports
        run: python -c "import app; import test_ui; assert test_ui.ClickToJumpSlider is not None, 'Qt tests would be skipped'"
        env:
          QT_QPA_PLATFORM: offscreen
          LYSNAV_REQUIRE_QT_TESTS: '1'
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
          LYSNAV_REQUIRE_QT_TESTS: '1'
      - run: python packaging/build_windows.py --portable-exe
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Verify installer and startup shortcuts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*-Setup.exe'
          ./packaging/test_installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v6
        with:
          name: lysnav-windows-x64-installer
          path: release/*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lysnav-windows-x64-portable-exe
          path: release/portable-exe/
          if-no-files-found: error

  msix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      LYSNAV_REQUIRE_QT_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-msix.txt
      - run: python -m unittest test_store
      - run: python packaging/build_msix.py
      - uses: actions/upload-artifact@v6
        with:
          name: lysnav-windows-x64-msix
          path: release/msix/*.msix
          if-no-files-found: error
